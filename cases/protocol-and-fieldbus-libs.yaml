# Release trees of libraries the free rule base gained after the first nine cases:
# network protocol stacks and industrial fieldbus stacks. Pristine copies under a
# neutral directory name; truth is the release tag. A "wrong" or "missing" row is a
# rule to fix, not a case to drop.

- id: nghttp2-1.44.0
  git: https://github.com/nghttp2/nghttp2
  ref: v1.44.0
  expect: {rule: generic/nghttp2, version: 1.44.0, bundled: [generic/llhttp]}
  variants: [pristine]

