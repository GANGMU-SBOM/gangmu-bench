# Vendor SDKs as published, pinned to a commit and fetched sparsely: only the directories
# holding the copies below (the whole trees run to gigabytes). Each copy is graded at its
# own path against the version the vendor wrote in its own files; a copy whose files state
# none is listed with version null and graded on the component alone.
# D1s-Melis also carries FreeType 2.3.5 (emodules/mod_orange/GUI/core/font/TrueType), older
# than any release generic/freetype records (2.4.0 on), so it is not graded.

- id: sdk-allwinner-r128s2-sdk-09
  git: https://github.com/bhgv/Allwinner-R128S2-SDK-09
  ref: 2941d13fa48e43e96c4351a85bc6aa2a5a556ca6
  subdir:
  - lichee/dsp/kernel/FreeRTOS_xtensa_v1.7/FreeRTOS
  - lichee/rtos-components/thirdparty/bluetooth/zephyr/src/tinycrypt
  - lichee/rtos-components/thirdparty/freetype
  - lichee/rtos-components/thirdparty/giflib/giflib-5.2.1
  - lichee/rtos-components/thirdparty/libjpeg-turbo/source
  - lichee/rtos-components/thirdparty/littlevgl-8/lvgl
  - lichee/rtos-components/thirdparty/network/mbedtls-2.16.0
  - lichee/rtos-components/thirdparty/network/mbedtls-2.7.0
  - lichee/rtos-components/thirdparty/opus
  - lichee/rtos-components/thirdparty/tinycrypt
  - lichee/rtos/components/thirdparty/elmfat/src
  - lichee/rtos/components/thirdparty/lfs/littlefs-2.2.1
  - lichee/rtos/kernel/FreeRTOS-orig/Source
  - lichee/rtos/kernel/FreeRTOS/Source
  copies:
  - path: lichee/rtos/components/thirdparty/elmfat/src
    expect:
      rule: generic/fatfs
      version: 0.13c
  - path: lichee/dsp/kernel/FreeRTOS_xtensa_v1.7/FreeRTOS
    expect:
      rule: generic/freertos-kernel
      version: null
  - path: lichee/rtos/kernel/FreeRTOS-orig/Source
    expect:
      rule: generic/freertos-kernel
      version: 10.4.3
  - path: lichee/rtos/kernel/FreeRTOS/Source
    expect:
      rule: generic/freertos-kernel
      version: 10.2.0
  - path: lichee/rtos-components/thirdparty/freetype
    expect:
      rule: generic/freetype
      version: 2.13.0
  - path: lichee/rtos-components/thirdparty/giflib/giflib-5.2.1
    expect:
      rule: generic/giflib
      version: 5.2.1
  - path: lichee/rtos-components/thirdparty/libjpeg-turbo/source
    expect:
      rule: generic/libjpeg-turbo
      version: 2.1.5.1
    stated_in: tarball name libjpeg-turbo-2.1.5.1.tar.gz
  - path: lichee/rtos/components/thirdparty/lfs/littlefs-2.2.1
    expect:
      rule: generic/littlefs
      version: '2.2'
  - path: lichee/rtos-components/thirdparty/littlevgl-8/lvgl
    expect:
      rule: generic/lvgl
      version: 8.1.0
  - path: lichee/rtos-components/thirdparty/network/mbedtls-2.16.0
    expect:
      rule: generic/mbedtls
      version: 2.16.0
  - path: lichee/rtos-components/thirdparty/network/mbedtls-2.7.0
    expect:
      rule: generic/mbedtls
      version: 2.7.0
  - path: lichee/rtos-components/thirdparty/opus
    expect:
      rule: generic/opus
      version: null
  - path: lichee/rtos-components/thirdparty/bluetooth/zephyr/src/tinycrypt
    expect:
      rule: generic/tinycrypt
      version: null
  - path: lichee/rtos-components/thirdparty/tinycrypt
    expect:
      rule: generic/tinycrypt
      version: null
  bundled:
  - generic/lodepng
  - generic/unity

