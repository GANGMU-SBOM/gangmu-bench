# Real upstream releases, copied under a neutral directory name so that no path
# or name hint helps. "strip" deletes the files a rule reads its version from,
# so only the function level decides; a range containing the truth is then a
# pass, because releases with identical functions cannot be told apart.
#
# Truth is the release tag. Every case names the rule it expects.

- id: mbedtls-2.28.10
  git: https://github.com/Mbed-TLS/mbedtls
  ref: mbedtls-2.28.10
  expect: {rule: generic/mbedtls, version: 2.28.10}
  variants:
    - pristine
    - strip: [include/mbedtls/version.h]

- id: mbedtls-3.6.4
  git: https://github.com/Mbed-TLS/mbedtls
  ref: mbedtls-3.6.4
  expect: {rule: generic/mbedtls, version: 3.6.4}
  variants:
    - pristine
    - strip: [include/mbedtls/version.h, include/mbedtls/build_info.h]

- id: littlefs-2.9.1
  git: https://github.com/littlefs-project/littlefs
  ref: v2.9.1
  expect: {rule: generic/littlefs, version: 2.9.1}
  variants: [pristine]

- id: littlefs-2.11.3
  git: https://github.com/littlefs-project/littlefs
  ref: v2.11.3
  expect: {rule: generic/littlefs, version: 2.11.3}
  variants: [pristine]

- id: tinycrypt-0.2.8
  git: https://github.com/intel/tinycrypt
  ref: v0.2.8
  expect: {rule: generic/tinycrypt, version: 0.2.8}
  variants: [pristine]

- id: lwip-2.2.0
  git: https://github.com/lwip-tcpip/lwip
  ref: STABLE-2_2_0_RELEASE
  expect: {rule: generic/lwip, version: 2.2.0}
  variants: [pristine]

- id: lwip-2.1.3
  git: https://github.com/lwip-tcpip/lwip
  ref: STABLE-2_1_3_RELEASE
  expect: {rule: generic/lwip, version: 2.1.3}
  variants: [pristine]

- id: libcoap-4.3.4
  git: https://github.com/obgm/libcoap
  ref: v4.3.4
  expect: {rule: generic/libcoap, version: 4.3.4}
  variants:
    - pristine
    - strip: [configure.ac, ChangeLog]

- id: lvgl-8.3.11
  git: https://github.com/lvgl/lvgl
  ref: v8.3.11
  expect: {rule: generic/lvgl, version: 8.3.11}
  variants:
    - pristine
    - strip: [lvgl.h]

# STMicroelectronics STM32Cube HAL and LL drivers. The version lives in
# Src/stm32<series>xx_hal.c (macros) and is also the file the rule's anchors
# hash, so the stripped variant leaves only the function level to decide.
