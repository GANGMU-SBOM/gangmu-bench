# Release trees behind BENCHMARK.md sections 1c-1e of gangmu: national-crypto
# generations and their OpenSSL base, and the libraries the Chinese vendor SDK survey
# found most often. "strip" deletes the version headers, so only functions decide;
# "touch" appends a comment to every C file, which breaks every byte-for-byte anchor.

